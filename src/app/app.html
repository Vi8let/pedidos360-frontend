<main class="container">
  <h1>Pedidos 360</h1>
  <p>Frontend Cloud Native</p>
  <hr>
  
  <div class="button-group">
    <button class="btn-primary" (click)="login()">
      Iniciar Sesión
    </button>
    <button class="btn-secondary" (click)="verSesion()">
      Ver Sesión
    </button>
    <button class="btn-primary" (click)="verPedidos()">
      Ver Pedidos
    </button>
    <button class="btn-danger" (click)="logout()">
      Cerrar Sesión
    </button>
  </div>

  @if (autenticado) {
    <section>
      <h2>Usuario Autenticado</h2>
      <p>Bienvenido, <strong>{{usuario}}</strong></p>

      <h3>Access Token</h3>
      <textarea rows="6" readonly>{{token}}</textarea>
    </section>
  }

  @if (mostrandoPedidos) {
    <div class="pedidos-list">
      <h3>Lista de Pedidos</h3>
      <p>Aquí se cargarán los pedidos desde tu API backend.</p>
    </div>
  }
</main>
